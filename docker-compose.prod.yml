name: alentapp-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-security: &default-security
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges=true

services:
  db:
    image: postgres:16-alpine
    container_name: alentapp-db-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alentapp-prod
    logging: *default-logging
    <<: *default-security
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cpus: 1.0
    mem_limit: 1g

  api:
    image: alentapp-api:prod
    container_name: alentapp-api-prod
    build:
      context: .
      dockerfile: packages/api/Dockerfile.prod
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    ports:
      - "3000:3000"
      - "9464:9464"
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - alentapp-prod
    logging: *default-logging
    <<: *default-security
    cpus: 0.75
    mem_limit: 512m

  migrate:
    build:
      context: .
      dockerfile: packages/api/Dockerfile.prod
      target: build
    container_name: alentapp-migrate-prod
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    command: ["/app/node_modules/.bin/prisma", "migrate", "deploy", "--config", "prisma.config.ts"]
    working_dir: /app/packages/api
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
    networks:
      - alentapp-prod
    logging: *default-logging
    <<: *default-security
    cpus: 0.5
    mem_limit: 512m

  web:
    image: alentapp-web:prod
    container_name: alentapp-web-prod
    build:
      context: .
      dockerfile: packages/web/Dockerfile.prod
    ports:
      - "80:80"
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
    networks:
      - alentapp-prod
    logging: *default-logging
    <<: *default-security
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cpus: 0.25
    mem_limit: 128m

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: alentapp-prometheus-prod
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
    networks:
      - alentapp-prod
    logging: *default-logging
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    cpus: 0.5
    mem_limit: 256m

  grafana:
    image: grafana/grafana:11.2.0
    container_name: alentapp-grafana-prod
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - alentapp-prod
    logging: *default-logging
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    cpus: 0.5
    mem_limit: 256m

networks:
  alentapp-prod:
    driver: bridge

volumes:
  pgdata_prod:
  prometheus_data:
  grafana_data:
